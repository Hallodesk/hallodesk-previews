<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hallodesk Outreach & Backlinks Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(17, 24, 39, 0.7);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.15);
            --success: #10b981;
            --success-glow: rgba(16, 185, 129, 0.15);
            --warning: #f59e0b;
            --purple: #8b5cf6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(29, 78, 216, 0.15) 0, transparent 50%),
                radial-gradient(at 50% 0%, rgba(139, 92, 246, 0.1) 0, transparent 50%),
                radial-gradient(at 100% 0%, rgba(16, 185, 129, 0.1) 0, transparent 50%);
            background-attachment: fixed;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 60px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 0;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 40px;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #fff;
        }

        .logo span {
            color: var(--accent);
        }

        .last-update {
            font-size: 0.85rem;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            padding: 6px 14px;
            border-radius: 9999px;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: relative;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .stat-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: var(--accent);
        }

        .stat-card.success::after { background: var(--success); }
        .stat-card.warning::after { background: var(--warning); }
        .stat-card.purple::after { background: var(--purple); }

        .stat-label {
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
        }

        .stat-val {
            font-size: 2.2rem;
            font-weight: 800;
            color: #fff;
            line-height: 1;
            margin: 6px 0;
        }

        .stat-desc {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* Controls / Tabs */
        .controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 30px;
        }

        .tabs {
            display: flex;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 4px;
            gap: 4px;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 10px 20px;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
        }

        .tab-btn.active {
            background: var(--accent);
            color: #fff;
        }

        .filter-panel {
            display: flex;
            gap: 12px;
            align-items: center;
            width: 100%;
            max-width: 450px;
        }

        .search-input {
            flex-grow: 1;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-color);
            padding: 10px 16px;
            border-radius: 10px;
            color: #fff;
            font-family: inherit;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.15s;
        }

        .search-input:focus {
            border-color: var(--accent);
        }

        /* Table Card Layout */
        .data-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background: rgba(255, 255, 255, 0.02);
            padding: 16px 24px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-color);
        }

        td {
            padding: 18px 24px;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.9rem;
            color: var(--text-main);
            vertical-align: middle;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background: rgba(255, 255, 255, 0.01);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 10px;
            font-size: 0.75rem;
            font-weight: 700;
            border-radius: 9999px;
            text-transform: uppercase;
        }

        .badge.blue { background: var(--accent-glow); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); }
        .badge.success { background: var(--success-glow); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
        .badge.warning { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
        .badge.purple { background: rgba(139, 92, 246, 0.15); color: #a78bfa; border: 1px solid rgba(139, 92, 246, 0.3); }

        .btn-action {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            text-decoration: none;
            transition: background 0.15s, border-color 0.15s;
        }

        .btn-action:hover {
            background: var(--accent);
            border-color: var(--accent);
        }

        /* Rating Stars */
        .stars {
            display: inline-flex;
            gap: 2px;
            color: var(--warning);
        }

        .stars svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }

        .rating-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Empty state */
        .empty-state {
            padding: 60px 24px;
            text-align: center;
            color: var(--text-muted);
            font-size: 1rem;
        }

        @media (max-width: 900px) {
            header { flex-direction: column; gap: 16px; align-items: flex-start; }
            .controls-bar { flex-direction: column; align-items: flex-start; }
            .filter-panel { max-width: 100%; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="logo">Hallodesk<span>.</span> Dashboard</div>
        <div class="last-update" id="last-update">Letztes Update: --</div>
    </header>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-label">Vorschau-Websites</div>
            <div class="stat-val" id="stat-proposals">0</div>
            <div class="stat-desc">Erstellte Layout-Prototypen</div>
        </div>
        <div class="stat-card success">
            <div class="stat-label">Angewandte Backlinks</div>
            <div class="stat-val" id="stat-backlinks">0</div>
            <div class="stat-desc">Eingereichte Backlink-Anträge</div>
        </div>
        <div class="stat-card warning">
            <div class="stat-label">E-Mail Kampagnen</div>
            <div class="stat-val" id="stat-campaigns">0</div>
            <div class="stat-desc">Outreach E-Mails vorbereitet</div>
        </div>
        <div class="stat-card purple">
            <div class="stat-label">Social Replies</div>
            <div class="stat-val" id="stat-replies">0</div>
            <div class="stat-desc">Antworten auf Quora / Reddit</div>
        </div>
    </div>

    <div class="controls-bar">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('websites')">Website Proposals</button>
            <button class="tab-btn" onclick="switchTab('backlinks')">Backlinks</button>
            <button class="tab-btn" onclick="switchTab('campaigns')">Campaigns</button>
            <button class="tab-btn" onclick="switchTab('replies')">Social Replies</button>
        </div>
        <div class="filter-panel">
            <input type="text" class="search-input" id="search" placeholder="Suche..." oninput="renderCurrentTab()">
        </div>
    </div>

    <div class="data-card">
        <table id="data-table">
            <thead>
                <!-- Loaded dynamically -->
            </thead>
            <tbody id="data-body">
                <!-- Loaded dynamically -->
            </tbody>
        </table>
        <div class="empty-state" id="empty-state" style="display: none;">
            Keine Daten vorhanden.
        </div>
    </div>
</div>

<script>
    let dashboardData = {
        last_updated: "",
        website_leads: [],
        applied_backlinks: [],
        outreach_campaigns: [],
        replies: []
    };

    let currentTab = "websites";

    async function loadData() {
        try {
            const res = await fetch('./dashboard_data.json');
            if (res.ok) {
                dashboardData = await res.json();
                updateStats();
                renderCurrentTab();
            }
        } catch(e) {
            console.error("Error loading dashboard data:", e);
        }
    }

    function updateStats() {
        document.getElementById("last-update").innerText = `Letztes Update: ${dashboardData.last_updated}`;
        document.getElementById("stat-proposals").innerText = dashboardData.website_leads.length;
        document.getElementById("stat-backlinks").innerText = dashboardData.applied_backlinks.length;
        document.getElementById("stat-campaigns").innerText = dashboardData.outreach_campaigns.length;
        document.getElementById("stat-replies").innerText = dashboardData.replies.length;
    }

    function switchTab(tabName) {
        currentTab = tabName;
        document.querySelectorAll(".tab-btn").forEach(btn => {
            btn.classList.remove("active");
            if (btn.innerText.toLowerCase().includes(tabName.substring(0, 4))) {
                btn.classList.add("active");
            }
        });
        document.getElementById("search").value = "";
        renderCurrentTab();
    }

    function renderCurrentTab() {
        const search = document.getElementById("search").value.toLowerCase();
        const thead = document.querySelector("#data-table thead");
        const tbody = document.getElementById("data-body");
        const emptyState = document.getElementById("empty-state");

        tbody.innerHTML = "";
        emptyState.style.display = "none";

        let htmlHeader = "";
        let rows = [];

        if (currentTab === "websites") {
            htmlHeader = `
                <tr>
                    <th>Datum</th>
                    <th>Name</th>
                    <th>Nische</th>
                    <th>Ort</th>
                    <th>Telefon</th>
                    <th>Google Info</th>
                    <th>Status</th>
                    <th>Aktion</th>
                </tr>
            `;
            rows = dashboardData.website_leads.filter(item => 
                (item.name || "").toLowerCase().includes(search) || 
                (item.niche || "").toLowerCase().includes(search) ||
                (item.city || "").toLowerCase().includes(search)
            ).map(item => `
                <tr>
                    <td>${item.date || ""}</td>
                    <td style="font-weight: 600;">${item.name || ""}</td>
                    <td>${item.niche || ""}</td>
                    <td>${item.city || ""}</td>
                    <td>${item.phone || "Auf Anfrage"}</td>
                    <td>
                        ${item.rating ? `
                            <div class="rating-wrapper">
                                <span style="font-weight: 700;">${item.rating}</span>
                                <div class="stars">
                                    <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                                </div>
                                <span style="color: var(--text-muted); font-size: 0.8rem;">(${item.reviews} Rev)</span>
                            </div>
                        ` : '<span style="color: var(--text-muted);">OSM Data</span>'}
                    </td>
                    <td><span class="badge success">${item.status || "Vorschau erstellt"}</span></td>
                    <td>
                        <a href="${item.url}" target="_blank" class="btn-action">
                            Vorschau
                        </a>
                    </td>
                </tr>
            `);
        } else if (currentTab === "backlinks") {
            htmlHeader = `
                <tr>
                    <th>Datum</th>
                    <th>Plattform</th>
                    <th>Domain</th>
                    <th>DR / DA</th>
                    <th>Typ</th>
                    <th>Status</th>
                    <th>Zielseite</th>
                    <th>Live Link</th>
                </tr>
            `;
            rows = dashboardData.applied_backlinks.filter(item => 
                (item.domain || "").toLowerCase().includes(search) || 
                (item.platform || "").toLowerCase().includes(search)
            ).map(item => `
                <tr>
                    <td>${item.date || ""}</td>
                    <td style="font-weight: 600;">${item.platform || ""}</td>
                    <td>${item.domain || ""}</td>
                    <td><span class="badge purple">${item.dr_da || ""}</span></td>
                    <td>${item.type || ""}</td>
                    <td><span class="badge success">${item.status || ""}</span></td>
                    <td><span style="font-size:0.8rem; color: var(--text-muted);">${item.target_page || ""}</span></td>
                    <td>
                        ${item.live_url ? `<a href="${item.live_url}" target="_blank" class="btn-action">Link</a>` : '<span style="color: var(--text-muted);">-</span>'}
                    </td>
                </tr>
            `);
        } else if (currentTab === "campaigns") {
            htmlHeader = `
                <tr>
                    <th>Datum</th>
                    <th>Name</th>
                    <th>Nische</th>
                    <th>E-Mail</th>
                    <th>Ort</th>
                    <th>Status</th>
                </tr>
            `;
            rows = dashboardData.outreach_campaigns.filter(item => 
                (item.name || "").toLowerCase().includes(search) || 
                (item.niche || "").toLowerCase().includes(search) || 
                (item.email || "").toLowerCase().includes(search)
            ).map(item => `
                <tr>
                    <td>${item.date || ""}</td>
                    <td style="font-weight: 600;">${item.name || ""}</td>
                    <td>${item.niche || ""}</td>
                    <td>${item.email || ""}</td>
                    <td>${item.city || ""}</td>
                    <td><span class="badge blue">${item.status || "Ready"}</span></td>
                </tr>
            `);
        } else if (currentTab === "replies") {
            htmlHeader = `
                <tr>
                    <th>Plattform</th>
                    <th>Titel</th>
                    <th>Status</th>
                </tr>
            `;
            rows = dashboardData.replies.filter(item => 
                (item.title || "").toLowerCase().includes(search) || 
                (item.platform || "").toLowerCase().includes(search)
            ).map(item => `
                <tr>
                    <td style="font-weight: 600; text-transform: uppercase;">${item.platform || "Quora"}</td>
                    <td>${item.title || ""}</td>
                    <td><span class="badge success">${item.status || "Erfolgreich"}</span></td>
                </tr>
            `);
        }

        thead.innerHTML = htmlHeader;
        if (rows.length === 0) {
            emptyState.style.display = "block";
        } else {
            tbody.innerHTML = rows.join("");
        }
    }

    // Auto load on start
    loadData();
</script>
</body>
</html>
